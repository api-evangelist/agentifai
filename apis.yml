aid: agentifai
name: AgentifAI
description: >-
  AgentifAI is a Portuguese enterprise conversational-AI company, headquartered in Braga, that
  builds AliceOS - a voice-first AI contact-center and autonomous agent platform purpose-built for
  the regulated banking and healthcare sectors. AliceOS is sold as a managed enterprise deployment
  rather than a self-serve developer product: it orchestrates multi-agent workflows across phone,
  WhatsApp, SMS, email and web, and integrates with core banking systems, CRMs, fraud engines,
  Hospital Information Systems and EMR/EHR platforms over REST, SOAP and OAuth, with SIP and CTI
  telephony adapters. Reference deployments include Santander, Banco BPI, Caixa Geral de
  Depositos, Vivalto Sante, Lusiadas Saude and Luz Saude. The company publishes a first-party
  llms.txt and a SafeBase trust center naming SOC 2 Type 2, ISO/IEC 27001, ISO/IEC 42001:2023, PCI
  DSS v4.0.0 and HIPAA, but no public developer portal, API reference or machine-readable API
  contract.
